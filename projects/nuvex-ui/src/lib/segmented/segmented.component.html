<div class="nuvex-segmented__container">
  @for (item of normalizedOptions(); track item.value) {
    <button
      type="button"
      class="nuvex-segmented__item"
      [class.nuvex-segmented__item--active]="isSelected(item.value)"
      [class.nuvex-segmented__item--disabled]="disabled() || item.disabled"
      [disabled]="disabled() || item.disabled"
      (click)="selectItem(item.value)"
    >
      {{ item.label }}
    </button>
  }
</div>
