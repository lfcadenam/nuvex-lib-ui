<header class="nuvex-topbar">

  <!-- 1. MARCA / LOGO IZQUIERDO -->
  <div class="nuvex-topbar__brand">
    <ng-content select="[slot=brand]"></ng-content>
    @if (brandTitle()) {
      <div class="nuvex-topbar__brand-info">
        <span class="nuvex-topbar__brand-title">{{ brandTitle() }}</span>
      </div>
    }
  </div>

  <!-- 2. PESTAÑAS CENTRALES EN PÍLDORA TRANSLÚCIDA -->
  @if (tabs().length > 0) {
    <nav class="nuvex-topbar__nav-pill" aria-label="Navegación principal">
      @for (tab of tabs(); track tab.id) {
        <button
          type="button"
          class="nuvex-topbar__tab"
          [class.nuvex-topbar__tab--active]="activeTabId() === tab.id || tab.active"
          (click)="selectTab(tab)"
        >
          <span>{{ tab.label }}</span>
          @if (tab.badge) {
            <span class="nuvex-topbar__tab-badge">{{ tab.badge }}</span>
          }
        </button>
      }
    </nav>
  }

  <!-- 3. ACCIONES DERECHAS (LIVE BADGE + MENÚ DE USUARIO) -->
  <div class="nuvex-topbar__actions">
    @if (liveMetric()) {
      <div class="nuvex-topbar__live-pill">
        <span class="nuvex-topbar__live-dot" aria-hidden="true"></span>
        <span class="nuvex-topbar__live-text">{{ liveMetric() }}</span>
      </div>
    }

    <ng-content select="[slot=actions]"></ng-content>

    <!-- MENÚ DE USUARIO OFICIAL NUVEX (SOLO 4 BOTONES) -->
    @if (user()) {
      <div class="nuvex-topbar__user-container">
        <button
          type="button"
          class="nuvex-topbar__user-trigger"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="isMenuOpen()"
        >
          <div class="nuvex-topbar__user-avatar">
            {{ user()?.avatarText || user()?.name?.charAt(0) || 'U' }}
          </div>
          <span class="nuvex-topbar__user-name">{{ user()?.name }}</span>
          <svg class="nuvex-topbar__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- DROPDOWN FLOTANTE EN CÁPSULA SUAVE (4 BOTONES EXCLUSIVOS) -->
        @if (isMenuOpen()) {
          <div class="nuvex-topbar__user-dropdown" (click)="$event.stopPropagation()">
            <div class="nuvex-topbar__dropdown-header">
              <span class="nuvex-topbar__dropdown-name">{{ user()?.name }}</span>
              @if (user()?.role) {
                <span class="nuvex-topbar__dropdown-role">{{ user()?.role }}</span>
              }
            </div>

            <!-- 1. Perfil -->
            <button
              type="button"
              class="nuvex-topbar__dropdown-item"
              (click)="triggerMenuOption('perfil')"
            >
              <svg class="nuvex-topbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <span>Perfil</span>
            </button>

            <!-- 2. Facturas -->
            <button
              type="button"
              class="nuvex-topbar__dropdown-item"
              (click)="triggerMenuOption('facturas')"
            >
              <svg class="nuvex-topbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <span>Facturas</span>
            </button>

            <!-- 3. Clave -->
            <button
              type="button"
              class="nuvex-topbar__dropdown-item"
              (click)="triggerMenuOption('clave')"
            >
              <svg class="nuvex-topbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
              </svg>
              <span>Clave</span>
            </button>

            <div class="nuvex-topbar__dropdown-divider"></div>

            <!-- 4. Cerrar sesión -->
            <button
              type="button"
              class="nuvex-topbar__dropdown-item nuvex-topbar__dropdown-item--logout"
              (click)="triggerMenuOption('logout')"
            >
              <svg class="nuvex-topbar__dropdown-icon nuvex-topbar__dropdown-icon--danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              <span>Cerrar sesión</span>
            </button>
          </div>
        }
      </div>
    }
  </div>

</header>
