<nav
  class="nuvex-capsule-dock__nav"
  [class.nuvex-capsule-dock__nav--light]="variant() === 'light'"
  [class.nuvex-capsule-dock__nav--dark]="variant() === 'dark'"
  [class.nuvex-capsule-dock__nav--horizontal]="orientation() === 'horizontal'"
  [class.nuvex-capsule-dock__nav--vertical]="orientation() === 'vertical'"
  aria-label="Dock de navegación"
>
  <!-- 1. ACCIONES SUPERIORES / LOGO O BÚSQUEDA -->
  <div class="nuvex-capsule-dock__top">
    <ng-content select="[slot=top]"></ng-content>
  </div>

  <!-- 2. ITEMS CENTRALES DE NAVEGACIÓN -->
  <div class="nuvex-capsule-dock__items">
    <ng-content></ng-content>

    @for (item of items(); track item.id) {
      <div class="nuvex-capsule-dock__item-wrapper">
        <button
          type="button"
          class="nuvex-capsule-dock__btn"
          [class.nuvex-capsule-dock__btn--active]="activeId() === item.id || item.active"
          [attr.aria-label]="item.label"
          (click)="selectItem(item)"
        >
          @if (item.icon) {
            <span class="nuvex-capsule-dock__icon" [innerHTML]="getSafeIcon(item.icon)"></span>
          } @else {
            <span class="nuvex-capsule-dock__initial">{{ item.label.charAt(0) }}</span>
          }

          @if (item.badge) {
            <span class="nuvex-capsule-dock__badge">{{ item.badge }}</span>
          }
        </button>

        @if (showTooltip() && item.label) {
          <span class="nuvex-capsule-dock__tooltip" role="tooltip">
            {{ item.label }}
          </span>
        }
      </div>
    }
  </div>

  <!-- 3. ACCIONES INFERIORES / THEME SWITCHER -->
  <div class="nuvex-capsule-dock__bottom">
    <ng-content select="[slot=bottom]"></ng-content>
  </div>
</nav>
