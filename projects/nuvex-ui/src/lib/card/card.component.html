@if (title() || hasHeaderSlot) {
  <div class="nuvex-card__header">
    <div class="nuvex-card__header-content">
      @if (title()) {
        <h3 class="nuvex-card__title">{{ title() }}</h3>
      }
      @if (subtitle()) {
        <p class="nuvex-card__subtitle">{{ subtitle() }}</p>
      }
    </div>
    <div class="nuvex-card__header-actions">
      <ng-content select="[slot=header]"></ng-content>
    </div>
  </div>
}

<div class="nuvex-card__body">
  <ng-content></ng-content>
</div>

<div class="nuvex-card__footer">
  <ng-content select="[slot=footer]"></ng-content>
</div>
